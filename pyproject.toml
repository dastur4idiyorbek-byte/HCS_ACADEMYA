[project]
name = "halol-crypto-savdo"
version = "0.1.0"
description = "HALOL CRYPTO SAVDO — halol kripto spot savdo signallari va avtomatlashtirilgan tahlil mexanizmi"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# LOYIHA ILDIZI import yo'liga qo'shiladi.
#
# Ansiz `pytest` (to'g'ridan-to'g'ri chaqirilganda) `core` ni
# TOPA OLMAYDI va conftest yuklanishidayoq yiqiladi:
#
#     ModuleNotFoundError: No module named 'core.config'
#
# `python -m pytest` esa ishlaydi, chunki `-m` joriy jildni
# yo'lga o'zi qo'shadi. Ya'ni bir xil kod ikki xil chaqiruvda
# ikki xil natija berardi — va GitHub Actions aynan ishlamaydigan
# variantni ishlatardi (`.github/workflows/testlar.yml`).
#
# Bu qator ikkala yo'lni ham ishlatadi.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:core.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic generatsiya qiladigan fayllar — mashina chiqishi, qo'lda
# tahrirlanmaydi va uslub qoidalariga bo'ysunmaydi.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
