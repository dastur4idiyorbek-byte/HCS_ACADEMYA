# =============================================================================
#  HALOL CRYPTO SAVDO — markaziy konfiguratsiya
#  6.4-band talabi: BARCHA "sehrli raqamlar" shu yerda. Kodda qattiq raqam yo'q.
#  Admin panel orqali o'zgartiriladigan qiymatlar bazadagi `risk_config` /
#  `price_config` jadvallaridan ustun keladi (qatlamli konfiguratsiya).
# =============================================================================

project:
  name: "HALOL CRYPTO SAVDO"
  default_language: "uz"
  supported_languages: ["uz"]      # kelajakda: ["uz", "ru"]

# --- 3.4-band: halol coin skrining ---
halal_screening:
  # Tahlil qilinadigan coinlar soni. 30 dan 150 ga kengaytirildi: sokinlik
  # dashboardi rad etishlarning 66% i "narx support zonasidan uzoq" ekanini
  # ko'rsatdi — ya'ni to'siq strategiyada emas, TANLOV DOIRASIDA edi.
  # Bir vaqtning o'zida nechta signal ochiq turishini bu raqam emas, Risk
  # Engine belgilaydi (4.2-band), shuning uchun ro'yxatni kengaytirish
  # signal oqimini toshirib yubormaydi.
  target_count: 150
  max_scan_depth: 500              # reyting bo'yicha maksimal necha o'ringacha tekshiriladi
  # Likvidlik filtri. ATAYLAB pasaytirilmadi: reytingda pastroq turgan
  # coinlarda kunlik hajm kichik bo'ladi va $500 lik buyurtma ham narxni
  # surib yuboradi (slippage). Ro'yxat 150 taga to'lmasa — bu nosozlik
  # emas, shu filtr ishlagani. Haqiqiy son `/panel` -> Halol ro'yxatda.
  min_daily_volume_usd: 50_000_000
  quote_asset: "USDT"              # spot juftlik kotirovkasi
  exclude_stablecoins: true
  stablecoin_symbols:
    [USDT, USDC, DAI, FDUSD, TUSD, USDE, PYUSD, USDD, BUSD, USDP, EURS]
  refresh_interval_hours: 12
  # Boshlang'ich harom ro'yxati (admin bazada tahrirlaydi — 1.4-band).
  # Asos: foizli (riba) qarz protokollari, qimor/bahs, sun'iy privacy-anonimlik
  # xavfi, meme/qimorbozlik tabiati, an'anaviy moliya derivativlari.
  seed_haram_symbols:
    [AAVE, COMP, MKR, CRV, LDO, CAKE, DYDX, GMX, SNX, RPL, PENDLE, ENA,
     ROSE, XMR, ZEC, DASH, BNB, LEO, OKB, CRO]
  seed_mashbooh_symbols:
    [DOGE, SHIB, PEPE, WIF, BONK, FLOKI, TRUMP, TON, TRX, XRP]

# --- 3.1 / 3.2-band: tahlil ---
analysis:
  # 3.2-band (tuzatilgan): asosiy klassik strategiya uchun STANDART to'plam.
  # Eski to'plam (1h..1oy) haddan tashqari katta edi va signal chastotasini
  # keskin kamaytirardi.
  timeframes: ["4h", "1d", "1w"]
  # Kirish timeframei 1h dan 4h ga ko'chirildi (mean reversion tuzatishi).
  #
  # `classic_ta` — mean reversion strategiyasi ("arzon zonaga qaytganda
  # ol"). 1 soatlik grafik bunday strategiya uchun shovqinli: soxta
  # signal ko'p beradi. Keng tarqalgan amaliyot — mean reversion uchun
  # 4h/1d.
  #
  # `opening_range_scalp` bunga tegishli emas: u o'zining kunlik
  # ochilish mantig'i bilan 15m da ishlaydi.
  entry_timeframe: "4h"
  htf_confirmation: ["1d"]   # katta rasm; to'siq emas, ballga qo'shiladi
  # Bozor kengligi (3.7-band, 2-omil) o'z timeframeida qoladi: tasdiq
  # timeframelari qisqarganda ham u kunlik o'lchovda o'lchanishi kerak,
  # aks holda indeks kun bo'yi tebranardi.
  market_health_timeframe: "1w"
  candles_lookback: 500
  # 3.2-band: yuqori timeframelar muvofiqligi MAJBURIYmi.
  #
  # `false` — muvofiqlik BALLGA qo'shiladi, signalni to'xtatmaydi.
  # Sabab: kunlik EMA200 — 200 kunlik o'rtacha, ya'ni eng sekin
  # kechikuvchi o'lchov. Narx support zonasiga qaytganda katta rasm hali
  # o'zgarmagan bo'ladi; uni majburiy qilish burilish nuqtasidagi har
  # qanday kirishni to'sadi. Jonli o'lchov: rad etishlarning 32% i aynan
  # shu to'siqda edi.
  require_htf_alignment: false
  # Istisno: kelajakda alohida "uzoq muddatli/pozitsion" strategiya qo'shilsa,
  # u yuqori timeframelarni O'ZI e'lon qiladi (`Strategy.required_timeframes()`
  # orqali) — asosiy strategiyaga taalluqli emas, konfiguratsiya o'zgarmaydi.
  positional_timeframes: ["1d", "1w", "1M"]    # zaxira, hozircha ishlatilmaydi

  # 5.1.0-band: kirish buyurtmasi turini avtomatik tanlash
  entry_order:
    # Joriy narx Entry'dan shu foizdan yaqin bo'lsa — MARKET (kutish shart emas),
    # aks holda LIMIT (narx zonaga kelganda avtomatik bajariladi).
    market_threshold_pct: 0.15
    # Narx Entry'dan shu foizdan PASTGA tushib ketgan bo'lsa, zona buzilgan
    # hisoblanadi va signal berilmaydi (0.3-band fail-safe).
    zone_broken_threshold_pct: 0.30

  support_resistance:
    swing_lookback: 5              # pivot aniqlash uchun chap/o'ng shamlar soni
    zone_merge_atr_mult: 0.5       # yaqin zonalar shu ATR ulushida birlashtiriladi
    min_touches: 2                 # zona "muhim" bo'lishi uchun minimal test soni
    proximity_atr_mult: 1.0        # narx zonaga shu ATR masofasida bo'lsa "zonada"
    # Kirish uchun ruxsat etilgan eng yuqori diapazon foizi.
    #
    # Ilgari chegara qat'iy 50% (muvozanat chizig'i) edi va bu JAR
    # yaratardi: 49.9% — ruxsat, 50.1% — butunlay rad. Jonli ma'lumotda
    # rad etishlarning 60% i shu bosqichda edi, tafsilotlar esa "Premium
    # zonada (51%)" deb ko'rsatardi — chegaradan bir foiz narida.
    #
    # Ball chuqurlikni allaqachon darajali baholaydi: 50% da 0 ball,
    # Support'da to'liq ball. Ya'ni chuqurroq qaytish baribir yuqoriroq
    # o'ringa chiqadi — qat'iy jar shunchaki chetdagini yo'q qilardi.
    entry_max_range_pct: 55.0
    fibonacci_levels: [0.382, 0.5, 0.618]

  indicators:
    # EMA OLIB TASHLANDI (58-bo'lim). Trend YO'NALISHINI endi SMC
    # strukturasi aniqlaydi — u narxning o'z qadamlarini (HH/HL/LH/LL)
    # o'qiydi va kechikmaydi. EMA200 esa 200 shamlik o'rtacha edi:
    # haftalik timeframeda ~3.8 yil tarix talab qilardi va ko'p
    # altcoinlarni jimgina chetlab o'tardi.
    #
    # ADX qoldi: u yo'nalishni emas, KUCHNI o'lchaydi — struktura
    # javob bermaydigan savol.
    min_candles: 60                # tahlil uchun minimal sham (avval 200 edi)
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    volume_ma_period: 20
    atr_period: 14
    adx_period: 14
    adx_trend_threshold: 20        # bundan past — tekis (sideways) bozor

    # Nechta indikator tasdiqlashi SHART (4 tadan: trend, RSI, MACD, hajm).
    #
    # DIQQAT — o'lchangan muammo: 4/4 talab qilinsa, tizim amalda hech qachon
    # signal bermaydi. Sabab: MACD kechikuvchi indikator, u faqat narx
    # allaqachon ko'tarilgandan keyin tasdiqlaydi — o'sha paytda esa narx
    # Discount zonasidan chiqib ketgan bo'ladi. Ikki oyna kesishmaydi.
    #
    # 3.5-band ball tizimini AYNAN shu uchun yaratgan: indikatorlar ballga
    # hissa qo'shadi, qarorni esa umumiy ball chegarasi qabul qiladi.
    # Zona sharti (S/R + Discount) baribir MAJBURIY bo'lib qoladi —
    # "yolg'iz indikator-asosli signal yo'q" qoidasi buzilmaydi.
    min_confirmations: 2            # 4 = qat'iy "hammasi tasdiqlasin" varianti
    # Indikator tasdig'i signal uchun MAJBURIYmi.
    #
    # `false` — indikatorlar faqat BALLGA ta'sir qiladi, ya'ni ko'p coin
    # ichidan TANLASH uchun ishlatiladi, "mumkin/mumkin emas" qarori
    # uchun emas.
    #
    # Sabab: indikatorlar tabiatan KECHIKADI — ular narx harakatidan
    # keyin tasdiqlaydi. Narx support zonasiga qaytganda MACD hali
    # kesmagan, RSI hali qaytmagan. Ular tasdiqlaguncha narx arzon
    # zonadan chiqib ketadi. Ya'ni "indikator tasdiqlasin" talabi amalda
    # "arzon paytda olma, qimmatlashgach ol" degani.
    #
    # Qaror STRUKTURAGA (S/R zonasi) va RISK QOIDASIGA (3.3-band)
    # qoladi. Bu ikkisi kechikmaydi — ular narxning hozirgi joylashuvi
    # haqida gapiradi.
    require_confirmation: false

# --- 3.5-band: ball tizimi ---
  # --- CryptoSpot3% (ISC 1.0) qo'shimchalari ---
  # Uchalasi ham BALL BONUSI beradi, YO'LNI YOPMAYDI. Sabab: qat'iy
  # "VA" filtrlarini ko'paytirish bu loyihada allaqachon signal
  # voronkasini nolga tushirgan (docs/ARXITEKTURA.md, 40 va 44-bo'lim).
  # Struktura MAJBURIYmi. false — faqat bonus (standart va tavsiya
  # etilgan). true qilishdan oldin backtest bilan o'lchang: voronkadagi
  # `classic_ta:structure` qatori qancha nomzod yo'qotilishini aytadi.
  require_structure_alignment: false
  market_structure:                # SMC: HH/HL/LH/LL, BOS/CHOCH
    swing_lookback: 5
    min_swings: 4
    # Silliq ko'tarilishda burilish nuqtalari bo'lmaydi va struktura
    # "aniq emas" deb qoladi — holbuki bu eng kuchli trendning o'zi.
    # Zaxira o'lchov: oynadagi sof narx o'zgarishi.
    fallback_min_pct: 1.0
  liquidity_sweep:                 # LIT: "yalab o'tib qaytish"
    enabled: true
    lookback_bars: 30
    min_sweep_pct: 0.3             # BOSHLANG'ICH — backtest bilan sozlanadi
    max_reclaim_bars: 3
  session_overlap:                 # ICT Kill Zone: London-NY kesishuvi
    enabled: true
    start_hour_utc: 13
    end_hour_utc: 16

scoring:
  weights:
    support_resistance: 25
    trend: 20
    rsi: 15
    volume: 15
    macd: 10
    risk_reward: 15
  # 3.5-band: chegara statik EMAS — Bozor Salomatligi Indeksiga qarab moslashadi
  thresholds:
    # YUQORI band chegarasi 80 dan 70 ga tushirildi — o'lchov asosida.
    #
    # Indeksning shifti bozor KENGLIGIGA bog'liq: kenglik omili 25 ball
    # turadi, ya'ni kenglik 5% bo'lsa indeks 76 dan yuqoriga chiqa
    # olmaydi (qolgan omillar mukammal bo'lsa ham). Jonli botda kenglik
    # 5% edi va indeks 70-77 da yurdi — o'z shiftida.
    #
    # Natijada 80 lik chegara BIR MARTA HAM ishlamadi va "moslashuvchi
    # chegara" amalda doim 55 bo'lib qoldi.
    health_high_min: 65            # indeks >= 65 -> "yashil" rejim
    health_mid_min: 40             # indeks >= 40 -> "sariq" rejim
    # O'LCHAB tanlangan chegaralar. Ilgari 70 va 80 edi — bu raqamlar 100
    # ballik shkalada mantiqiy ko'rinadi, lekin ball funksiyasi amalda
    # 100 ga chiqmaydi: omillarning bir qismi bu strategiyada bir vaqtda
    # to'liq bo'la olmaydi (support'da xarid qilinsa MACD hali kesmagan
    # bo'ladi, RSI o'rta zonada bo'ladi, R/R aynan eng kam talabda
    # bo'ladi). `python -m scripts.kalibrlash` 27 ta turli sozlamada
    # o'lchadi: ENG YUQORI ball 59.7. Ya'ni 80 chegarasi bilan birorta
    # signal chiqishi mumkin emas edi — bot 48 soat jim turdi.
    #
    # Yangi qiymatlar o'sha taqsimotdan olingan:
    #   55 -> nomzodlarning eng yaxshi 33% i
    #   50 -> eng yaxshi 67% i
    # Chegarani o'zgartirishdan oldin `/panel` -> 🔇 dagi "eng yuqori
    # ball" qatoriga qarang: u haqiqiy bozordagi taqsimotni ko'rsatadi.
    threshold_high_health: 50      # bozor kuchli — chegara pastroq
    threshold_mid_health: 55       # bozor o'rtacha — talab qattiqroq
    # PAST band endi TO'XTATMAYDI, rejimni almashtiradi.
    #
    # Ilgari bu yerda "signal yo'q" turardi: indeks 40 dan pastga
    # tushganda coinlar umuman tahlil qilinmasdi. Bu strategiyaning
    # o'z falsafasiga zid edi — past indeks aynan narxlar ARZONLASHGAN
    # payt. Tizim shunda ko'zini yumib, indeks qayta ko'tarilgach
    # signal berardi, ya'ni doim KECH kirardi.
    #
    # Endi past bandda faqat `correction_entry` ishlaydi va chegara
    # qattiqroq: pasayishdagi kirish ko'proq dalil talab qiladi.
    threshold_low_health: 60
    # indeks < health_mid_min bo'lsa yangi signal umuman berilmaydi
  # Bonus — bazaviy 100 USTIGA. Faqat BITTA omil qoldi: Kill Zone.
  # Struktura, daraja turi va sweep endi bonus EMAS — ular mavjud
  # omillar ichiga qo'shiladi (`uplift`), chunki ular aynan S/R va
  # trend haqidagi dalil. Sessiya oynasi esa kirish VAQTI haqida,
  # ya'ni ikkalasiga ham tegishli emas.
  bonuses:
    session_overlap: 5             # Kill Zone vaqtida

  # ORALASHIB ISHLASH: CryptoSpot3% dalillari mavjud omillarni qancha
  # ko'tara oladi.  yangi = eski + (1 - eski) * dalil * ulush
  #
  # Bu shakl ballni hech qachon pasaytirmaydi va shkalani buzmaydi.
  # Dalil BAZAVIY ballga qo'shilgani uchun u chegaraga ta'sir qiladi —
  # ya'ni yangi modul signal SONINI ham o'zgartira oladi, nafaqat
  # tartibini. Ilgari u faqat bonus edi va son o'zgarmasdi.
  uplift:
    support_resistance: 0.5        # daraja turi + sweep -> S/R sifati
    # Trend uchun ko'tarish YO'Q: EMA olib tashlangach struktura trend
    # omilining to'liq huquqli qismiga aylandi, "qo'shimcha" emas.

  # Metodikaning TO'LIQ shartnomasi bajarildimi — YORLIQ, darvoza emas.
  # "Nega bu signal?" ekranida ko'rsatiladi va o'lchovda sanaladi.
  setup_route:
    enabled: true
    max_sweep_age_bars: 5          # eski yalash dalil emas
    require_bos: true              # metodikaning 4-qadami
    min_level_confidence: 0.6      # oddiy daraja yetarli emas

# --- 3.3-band: universal risk qoidasi ---
trade_rules:
  # Stop masofasi ATR ko'paytmasi bilan hisoblanadi (2-tuzatish).
  # Qat'iy foiz barcha coinlarga bir xil qo'llanardi, holbuki Stopning
  # maqsadi bozor shovqinidan himoya — shovqin esa ATR bilan o'lchanadi.
  # 1%-5% oralig'i YO'QOLMADI: u ikkinchi darajali xavfsizlik cheklovi
  # sifatida qoladi (juda tor yoki juda keng bo'lib qolmasin).
  stop_atr_mult: 1.75
  # ASOSIY SHART — NISBAT, masofa emas.
  #
  # Stop S/R zonasi qayerda ekaniga qarab 1%..5% oralig'ida erkin
  # joylashadi. Qat'iy 1% chegara narxni majburlab siqardi va signal
  # deyarli chiqmasdi — aynan 1% masofada mos zona kam uchraydi.
  #
  # Stop kattalashsa xavf OSHMAYDI: pozitsiya hajmi (xavf puli / Stop%)
  # avtomatik kichrayadi — 5.1-band formulasi.
  min_stop_distance_pct: 1.0       # bundan yaqin — bozor shovqini yeb qo'yadi
  # 5% dan 8% ga ko'tarildi. Arifmetika: stop_atr_mult=1.75 bo'lganda
  # ATR 2.86% dan oshsa Stop avtomatik 5% dan chiqib rad etilardi.
  # 4 soatlik grafikda altcoin ATR'i bundan tez-tez oshadi — ya'ni
  # "ikkinchi darajali" cheklov ASOSIY filtrga aylanib, ATR tuzatishini
  # bekor qilardi (jonli o'lchov: 146 -> 299 rad etish).
  # Pozitsiya hajmi avtomatik kichrayadi, ya'ni xavf oshmaydi (5.1-band).
  max_stop_distance_pct: 8.0
  min_tp_distance_pct: 3.0
  max_tp_distance_pct: 20.0        # Stop 5% bo'lsa TP 15% bo'lishi mumkin
  min_risk_reward: 3.0             # QAT'IY: TP2/Stop nisbati kamida 1:3
  # TP1 da pozitsiyaning yarmi yopiladi — u ham foydali nisbatda bo'lsin.
  # Stop 4% bo'lsa TP1 kamida 6% da turadi (4 x 1.5).
  tp1_min_risk_reward: 1.5
  # Kech kirish ogohlantirishi: narx kirish nuqtasidan shu foizdan ko'p
  # uzoqlashsa, HALI KIRMAGAN foydalanuvchiga xavf kattalashgani
  # aytiladi va kirish tavsiya etilmaydi. Ikkala tomonga ham: yuqoriga
  # ketsa TP gacha masofa qisqargan, pastga ketsa Stop yaqinlashgan.
  # To'siq emas — ogohlantirish.
  late_entry_warn_pct: 1.2

  # 3.1-band "TP1 — eng yaqin resistance" deydi. Lekin TOZA KO'TARILISH
  # TRENDIDA ustda qarshilik BO'LMAYDI — trend degani aynan shu.
  #
  # Natijada tizim aynan trend filtri talab qiladigan sharoitda hech qachon
  # signal bera olmasligi mumkin. `true` bo'lsa: qarshilik topilmasa, TP1
  # o'lchangan masofa (min_tp_distance_pct) bo'yicha qo'yiladi va signal
  # tafsilotida bu ochiq ko'rsatiladi.
  #
  # `false` — qat'iy tuzilmaviy variant: qarshilik yo'q bo'lsa signal yo'q.
  allow_measured_tp: true

# --- 4-bo'lim: Risk Engine ---
risk_engine:
  daily_loss_limit_pct: 3.0        # 4.1 — 5.1 bilan BITTA manba (kunlik byudjet)
  weekly_loss_limit_pct: 8.0
  max_open_signals: 5
  max_open_signals_by_health:      # 4.2 — moslashuvchan limit
    high: 5
    mid: 3
    low: 0
  # 4.3 — korrelyatsiya: STATIK guruhlar. Bitta guruhdan bir vaqtda 1 ta signal.
  correlation_groups:
    - name: "btc_major"
      symbols: [BTC, ETH, BCH, LTC]
    - name: "l1_smart_contract"
      symbols: [SOL, ADA, AVAX, NEAR, APT, SUI, DOT, ATOM]
    - name: "l2_eth_eco"
      symbols: [ARB, OP, MATIC, POL, STRK, ZK]
    - name: "ai_compute"
      symbols: [RENDER, FET, TAO, AKT, GRT]
  max_signals_per_correlation_group: 1
  # 4.5 — umumiy bozor (BTC) filtri
  btc_filter:
    reference_symbol: "BTC"
    max_drop_pct_24h: -5.0         # BTC 24 soatda shundan ko'p tushsa — signal yo'q
    timeframe: "4h"           # kirish timeframei bilan mos bo'lishi SHART
  # 4.7 — favqulodda to'xtash (kill switch)
  kill_switch:
    price_spike_pct: 5.0           # 1 daqiqada ±5% dan ortiq harakat
    price_spike_window_seconds: 60
    requires_manual_reset: true    # inson tekshirmaguncha qayta ishga tushmaydi
  # 3.8 — ketma-ket zarar kill switch
  consecutive_loss:
    max_consecutive_stops: 5
    cooldown_hours: 24
  # 4.8 — Juma namozi vaqti filtri
  friday_filter:
    enabled: true
    timezone: "Asia/Tashkent"      # UTC+5, config qilinadigan
    weekday: 4                     # Monday=0 ... Friday=4
    start: "11:00"
    end: "15:00"
    # DIQQAT: faqat YANGI signal generatsiyasi to'xtaydi.
    # Mavjud faol signallar kuzatuvi uzluksiz davom etadi.
  # 4.2 — signal rotatsiyasi
  rotation:
    min_score_gap: 30              # almashtirish tavsiyasi uchun minimal ball farqi
    cooldown_minutes: 120          # whipsaw himoyasi
  # 4.1 — dinamik chiqish
  weakening:
    score_drop_points: 25          # ball shuncha tushsa "⚠️ Zaiflashmoqda"

# --- 3.7-band: Bozor Salomatligi Indeksi ---
market_health:
  # 3-omil to'liq ball oladigan O'RTACHA ADX. Diqqat: bu bitta coinning
  # ADX'i emas, 30 ta halol coin O'RTACHASI. Bitta coinda ADX 40 kuchli
  # trend degani, lekin o'rtacha 40 ga deyarli chiqmaydi — coinlar har xil
  # vaqtda trendga kiradi. Batafsil: docs/ARXITEKTURA.md, 32-bo'lim.
  strong_trend_adx: 30
  weights:                         # yig'indisi 100 bo'lishi kerak
    # BTC Dominance 20 -> 5. Tajribali treyderlar bilan maslahat
    # natijasi: dominance foydali, lekin qaror mezoni emas. Uning
    # o'rniga ASOSIY omil — halol ro'yxatning SMC strukturasi.
    # ASOSIY: nechta coin HH/HL strukturasida. 30 dan 45 ga oshdi —
    # EMA olib tashlangach eski `halal_trend_breadth` (15) aynan shu
    # savolni kechikuvchi vosita bilan o'lchardi, ya'ni takror edi.
    halal_structure_breadth: 45
    volatility_regime: 15
    aggregate_user_capacity: 20
    signal_saturation: 10
    btc_dominance_stability: 5     # faqat qo'shimcha kontekst
    quarterly_phase: 5             # QT (AMDX) — BOSHLANG'ICH vazn
  recompute_on_candle_close: true
  daily_preview_utc_hour: 0        # UTC 00:00 atrofida kunlik oldindan tahlil
  btc_dominance:
    stable_change_pct: 0.5         # sutkalik o'zgarish shundan kichik bo'lsa "barqaror"
    sharp_change_pct: 2.0

# --- SINOV DAVRI (100 kun) ---
#
# Maqsad: 100 kun davomida strategiyaning O'ZINI kuzatish. Buning uchun
# tizim FAQAT BOZORGA qarab qaror qilsin — bizning holatimiz (nechta
# obunachimiz bor, bugun qancha zarar ko'rdik, nechta signalimiz ochiq)
# natijaga aralashmasin.
#
# Ikki narsa vaqtincha chetga chiqadi:
#
#   1. `exclude_health_factors` — Bozor Salomatligi indeksidan
#      chiqariladigan omillar. `aggregate_user_capacity` obunachilarning
#      balansi va kunlik xavf sig'imini o'lchaydi; u ~50 ta real
#      foydalanuvchi bo'lganda ma'noga ega, hozir esa bozor haqida hech
#      narsa aytmaydi. Vazni YO'QOLMAYDI — qolgan omillarga ulushiga
#      qarab bo'linadi, ya'ni indeks 0-100 shkalasida qoladi.
#
#   2. `suspend_risk_rules` — signal berishni BIZNING holatimizga qarab
#      to'xtatuvchi qoidalar. Ular ishlaganda sinov namunasi qiyshayadi:
#      yomon ertalakdan keyin tizim o'zini o'chiradi va qolgan kunni
#      umuman ko'rmaymiz.
#
# TO'XTATILMAYDI: bozorga oid qoidalar (Bozor Salomatligi, BTC filtri,
# tekis bozor, volatillik, narx yangiligi), diniy qoidalar (halol
# ro'yxat, juma namozi), favqulodda to'xtash va har bir signalning O'Z
# risk qoidalari (Stop/TP/RR, pozitsiya hajmi). Ya'ni signal sifati
# o'zgarmaydi — faqat "bugunga yetadi" degan tormozlar ushlab
# turilmaydi.
#
# Muddat tugagach hammasi O'ZI qaytadi.
sinov:
  enabled: true
  start_date: "2026-08-29"
  days: 100
  exclude_health_factors: ["aggregate_user_capacity"]
  suspend_risk_rules:
    - "daily_loss_limit"    # 4.1 — bugungi/haftalik zararimiz
    - "max_open_signals"    # 4.2 — nechta signalimiz ochiq
    - "correlation"         # 4.3 — shu guruhda allaqachon signal bor
    - "consecutive_loss"    # 4.10 — ketma-ket Stop yeganimiz

# --- 5-bo'lim: pozitsiya hajmi va portfel ---
position_sizing:
  # 5.1 — pog'onali kunlik xavf foizi (balans USD bo'yicha)
  risk_tiers:
    - { max_balance: 1000, daily_risk_pct: 3.0 }
    - { max_balance: 10000, daily_risk_pct: 2.0 }
    - { max_balance: null, daily_risk_pct: 1.5 }   # null = cheksiz (yuqori pog'ona)
  # 5.1.1 — kunlik limitni faol signallar orasida taqsimlash
  allocation_method: "sequential_decay"   # yoki "equal_split"
  sequential_decay_fraction: 0.34         # qolgan byudjetdan har signalga ulush
  equal_split_expected_slots: 3           # "equal_split" uchun kutilayotgan signal soni
  min_allocation_usd: 1.0
  # SPOT savdo: leverage yo'q, pozitsiya balansdan oshmaydi.
  # Stop 1% + kunlik xavf 3% bo'lsa formula 3x balans beradi — shuning uchun
  # hisoblangan hajm shu chegara bilan kesiladi va foydalanuvchiga aytiladi.
  max_position_pct_of_balance: 100.0
  # 5.2 — agregat foydalanuvchi sig'imi
  aggregate:
    capacity_used_threshold: 0.8   # foydalanuvchi byudjetining 80%i band bo'lsa "to'lgan"
    active_user_days: 7            # oxirgi N kunda faol bo'lgan obunachilar hisobga olinadi

# --- 3.9-band: Kunlik Sham Ochilishi Skalping ---
strategies:
  classic_ta:
    enabled: true
    # Mean reversion uchun eng kam TP2/Stop nisbati (3-tuzatish).
    #
    # Global 1:3 trend/breakout strategiyalariga xos. Mean reversion
    # tabiiy ravishda diapazon o'rtasiga yoki resistance'ga qaytganda
    # yopiladi — bu odatda 1:1..1:1.5 beradi. 1:3 talab qilish bu
    # strategiya uchun deyarli hech qachon bajarilmaydigan shart edi.
    #
    # STRATEGIYA darajasida: boshqa turdagi strategiya qo'shilsa, u
    # o'zining tabiiy nisbatini (1:2-1:5) saqlaydi.
    min_risk_reward: 1.5
  # Bozor pasayganda ishlaydigan kirish usuli (Correction Entry).
  #
  # Bozor Salomatligi past bo'lgan payt — narxlar ARZONLASHGAN payt.
  # Eski tizim aynan shunda qidirishni to'xtatardi va indeks qayta
  # ko'tarilganda, narx allaqachon o'sib bo'lgach signal berardi —
  # ya'ni doim KECH kirardi. Bu strategiya o'sha bo'shliqni to'ldiradi.
  #
  # QAT'IY DARVOZA: kunlik timeframe KO'TARILISHDA bo'lishi shart.
  # Tushayotgan bozorda "arzon" degan narsa yo'q.
  correction_entry:
    # HOZIRCHA O'CHIRILGAN — backtest tugagach yoqiladi.
    #
    # Brief talabi: "hech qanday yangi qoida sinovsiz jonli ishga
    # tushirilmasin". Strategiya kodi tayyor va testlar bilan
    # qoplangan, lekin haqiqiy bozorda o'lchanmagan.
    #
    # Yoqish tartibi:
    #   1. python -m scripts.backtest --compare --days 365
    #      (tarmoqsiz mashinada: --offline, kesh oldindan yig'ilgan
    #       bo'lishi kerak — `data/candles/`)
    #   2. taqqoslashda "yangi: Correction Entry" qatori "eski: past
    #      bandda to'xtash" qatoridan yaxshi bo'lsa -> enabled: true
    #   3. dastlab kuzatuv ostida, kichik hajm bilan
    enabled: false
    zone_timeframe: "4h"        # zona shu yerda topiladi
    confirm_timeframe: "15m"    # aniq nuqta shu yerda tasdiqlanadi
    trend_timeframe: "1d"       # yo'nalish darvozasi
    impulse_lookback: 60
    fib_ratios: [0.382, 0.618]  # "oltin zona"
    ob_min_move_pct: 1.0
    fvg_min_gap_pct: 0.1
    # Kamida ikkita TURLI manba bir joyga tushishi shart. Beshta
    # usuldan "eng mosini" tanlash har doim qandaydir usul topiladi
    # degani — bu tarixga moslashib qolish (overfitting).
    min_confluence: 2
    confirm_lookback: 20
    stop_buffer_pct: 0.15
    # BOSHLANG'ICH qiymat — backtest bilan aniqlanadi.
    min_risk_reward: 2.0
    rsi_reversal_max: 45.0

  opening_range_scalp:
    enabled: true
    session_open_utc: "00:00"
    range_minutes: 15              # ochilish diapazoni shakllanish vaqti
    timeframe: "15m"               # diapazon shu timeframening birinchi shamidan olinadi
    volume_surge_mult: 2.0         # hajm o'rtachadan shuncha marta oshsa
    volume_ma_period: 20
    min_move_pct: 1.0              # kutilayotgan harakat oralig'i
    max_move_pct: 2.0
    # Ochilishdan keyin signal qidiriladigan oyna. Undan keyin imkoniyat
    # o'tib ketgan hisoblanadi — kech kirish eng yomon kirish.
    # Ochilishdan keyin signal oynasi necha daqiqa ochiq turadi.
    #
    # 45 daqiqadan bir kunga (1440) uzaytirildi: 45 daqiqa kunning 3% i,
    # ya'ni oyna vaqtning 97% ida yopiq turardi va dashboardda "Skalping
    # oynasi yopiq" hamma narsadan ko'p chiqardi (5114 marta).
    #
    # ALMASHUV: kech kirish yomonroq kirish. Diapazon kun boshida
    # qurilgani uchun kunning oxiridagi buzilish "eskirgan" diapazonga
    # nisbatan o'lchanadi. Buzilish kuchi va hajm baribir talab
    # qilinadi, lekin bu almashuv ongli ravishda qabul qilingan.
    signal_window_minutes: 1440
    # Diapazon narxning shu foizidan tor bo'lsa — harakat yo'q, o'tkazamiz
    min_range_pct: 0.15
    # Diapazon shu foizdan keng bo'lsa — Stop juda uzoq qolardi
    max_range_pct: 1.2
    daily_risk_share_pct: 30.0     # umumiy kunlik byudjetdan shu ulushdan oshmaydi
    # Ball vaznlari (jami 100). Asosiy strategiyanikidan FARQ qiladi:
    # bu yerda S/R yo'q, hajm va yo'nalish aniqligi hal qiluvchi.
    weights:
      volume_surge: 35
      range_quality: 25
      direction_clarity: 25
      risk_reward: 15

# --- 5.4-band: Shaxsiy portfel ---
portfolio:
  # TP1 ga yetganda pozitsiyaning necha foizi yopiladi.
  #
  # Nima uchun kerak: TP1 olinib, keyin narx qaytib Stop'ga tushsa,
  # bu holat foydali ham, zararli ham bo'lishi mumkin. Qismli yopishni
  # hisobga olmasak, tizim uni sof zarar deb ko'rsatardi va foydalanuvchi
  # raqamlarga ishonmay qolardi.
  tp1_close_pct: 50.0
  # Foydalanuvchi kiritishi mumkin bo'lgan minimal miqdor
  min_position_usd: 1.0

# --- 3.8-band: Signal Xotirasi (postmortem) ---
postmortem:
  # Naqsh e'lon qilish uchun MINIMAL namuna. Bu — halollik chegarasi:
  # 5 ta signal asosida "70% Stop yeydi" deyish statistika emas, shovqin.
  min_sample_size: 12
  # Naqsh "kuchli" deb hisoblanishi uchun natijalar farqi (foiz punkti)
  min_effect_pct: 15.0
  # Tahlil qilinadigan davr
  lookback_days: 30
  # Haftalik hisobot qaysi kun yuboriladi (Monday=0 ... Sunday=6)
  report_weekday: 0
  report_hour_utc: 6
  # Faol bo'lgach shu vaqt ichida Stop yesa — "yolg'on signal"
  false_signal_window_minutes: 60

# --- 1.2-band: obuna ---
subscriptions:
  tiers: ["lite", "pro", "premium"]
  periods:
    daily: 1
    monthly: 30
  expiry_reminder_days: [2, 1]     # oylik obuna uchun eslatma
  currencies: ["KGS", "USDT"]

# --- 6.2-band: bozor ma'lumotlari ---
market_data:
  exchange: "binance"              # binance | bybit
  ws_base_url: "wss://stream.binance.com:9443/stream"
  rest_base_url: "https://api.binance.com"
  # Kapitalizatsiya reytingi manbai (3.4-band, halol ro'yxat uchun).
  # CoinMarketCap API kalitini talab qiladi -> .env dagi CMC_API_KEY.
  # Kalit yo'q bo'lsa tizim skrining qilmaydi va halol ro'yxat yangilanmaydi
  # (0.3-band fail-safe: eski, tasdiqlangan ro'yxat bilan davom etadi).
  ranking_source: "coinmarketcap"  # coinmarketcap | coingecko
  coinmarketcap_base_url: "https://pro-api.coinmarketcap.com/v1"
  coingecko_base_url: "https://api.coingecko.com/api/v3"   # zaxira manba
  reconnect_backoff_seconds: [2, 4, 8, 16, 32]
  stale_price_seconds: 90          # shundan uzoq yangilanmasa — fail-safe, signal yo'q
  # Bir vaqtda nechta OHLCV so'rovi ketsin. Chegarasiz bo'lsa 150 coin x 3
  # timeframe = 450 ta parallel so'rov, Binance esa 429 va keyin 418 (IP ban)
  # qaytaradi — ya'ni ro'yxat kengaygani sari tizim KAMROQ ma'lumot olardi.
  max_concurrent_candle_requests: 8

# --- 6.4-band: logging ---
# --- Kuzatuv vositalari (savdo qaroriga ta'sir qilmaydi) ---
monitoring:
  # Jonli tahlil monitori — "oshxona ko'rinishi" (59-bo'lim).
  # Admin tizimning orqa fonda nima qilayotganini ko'zi bilan ko'radi.
  pipeline_events:
    enabled: true
    # JONLI ko'rinish, doimiy arxiv EMAS: doimiy statistika risk_blocks
    # da va Signal Xotirasi modulida qoladi. Tozalanmasa jadval cheksiz
    # o'sardi — har sikl har coin uchun 9-11 qator.
    retention_hours: 6

logging:
  level: "INFO"
  dir: "logs"
  rotate_mb: 20
  backups: 5
