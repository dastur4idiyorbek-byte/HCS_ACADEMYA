# Railway uchun sozlama.
#
# Bu xizmat ichida IKKITA jarayon ishlaydi (`scripts/start.sh`):
#   1. bot   — fon jarayoni (port ochmaydi)
#   2. sayt  — Next.js, `$PORT` da
#
# Nima uchun ikkalasi bitta xizmatda: Railway'da doimiy disk faqat bitta
# xizmatga ulanadi, baza esa o'sha diskdagi SQLite fayli. Sayt uni
# to'g'ridan-to'g'ri o'qishi kerak — demak, ular bir joyda yashashi shart.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "bash scripts/start.sh"

# Jarayonlardan biri yiqilsa skript butun konteynerni to'xtatadi,
# Railway esa uni qayta ko'taradi.
restartPolicyType = "ALWAYS"

# Sayt tayyor bo'lgunicha Railway trafik yubormasin.
#
# Manzil ATAYLAB sahifa emas: sahifa cookie o'qiydi va nazariy jihatdan
# 500 qaytarishi mumkin — o'shanda Railway butun deploy'ni muvaffaqiyatsiz
# deb belgilab, ESKI versiyani saqlab qoladi va sabab ko'rinmay qoladi.
healthcheckPath = "/api/health"
healthcheckTimeout = 180
