# Railway uchun sozlama.
#
# Nima uchun bu fayl kerak: Railway kodni o'zi topib yig'adi, lekin uni
# QANDAY ishga tushirishni bilmaydi. Bu bot veb-server emas — u fon
# jarayoni (worker), shuning uchun port ochmaydi.

[build]
builder = "NIXPACKS"

[deploy]
# Uch qadam ketma-ket:
#   1. alembic  — jadvallarni yaratadi yoki yangilaydi
#   2. seed     — boshlang'ich narxlar va coin qarorlari (takroriy xavfsiz)
#   3. bot.main — botning o'zi
#
# Birinchi ikkisi yiqilsa bot ham ishga tushmaydi — bu ATAYLAB shunday:
# yarim sozlangan baza bilan ishlagandan ko'ra to'xtagan yaxshi (0.3-band).
startCommand = "alembic upgrade head && python -m scripts.seed && python -m bot.main"

# Bot yiqilsa Railway uni qayta ko'taradi (serverdagi systemd kabi).
restartPolicyType = "ALWAYS"
