# ABLATION va WALK-FORWARD ni brauzerda ishga tushirish.
#
# GitHub sahifasida: Actions -> "Tekshiruv (ablation / walk-forward)"
# -> "Run workflow". Tugagach `tekshiruv-natija` faylini yuklab olasiz
# (CSV va matn ko'rinishida).
#
# ESLATMA: GitHub serverlari AQShda va `api.binance.com` ularga 451
# qaytaradi. Shuning uchun standart manba — `data-api.binance.vision`.

name: Tekshiruv (ablation / walk-forward)

on:
  workflow_dispatch:
    inputs:
      tur:
        description: "Qaysi tekshiruv"
        required: true
        default: "ikkalasi"
        type: choice
        options: [ikkalasi, ablation, walk-forward]
      days:
        description: "Necha kun TAHLIL qilinsin (isinish tarixi ustiga qo'shiladi)"
        required: true
        default: "730"
      symbols:
        description: "Coinlar (vergul bilan)"
        required: true
        default: "BTC,ETH,SOL,BNB,XRP"
      bolaklar:
        description: "Walk-forward: tarix necha bo'lakka bo'linsin"
        required: true
        default: "3"
      grid:
        description: "Walk-forward: parametr to'ri (kichik = 12, toliq = 36 nomzod)"
        required: true
        default: "kichik"
        type: choice
        options: [kichik, toliq]
      end_date:
        description: "Sinov oynasining OXIRI (YYYY-MM-DD, bo'sh = eng so'nggi)"
        required: false
        default: ""
      base_url:
        description: "Binance manbai"
        required: true
        default: "https://data-api.binance.vision"

jobs:
  tekshiruv:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      # Kesh kaliti VERGUL saqlamaydi — GitHub uni rad etadi.
      # Kalitda TAHLIL + ISINISH kunlari turadi, aks holda isinish
      # talabi o'zgargach eski KALTA kesh qayta ishlatilardi.
      - name: Kesh kaliti
        id: kalit
        env:
          SYMBOLS: ${{ inputs.symbols }}
          DAYS: ${{ inputs.days }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          COINLAR=$(printf '%s' "$SYMBOLS" | tr ',' '-' | tr -cd 'A-Za-z0-9-')
          KUNLAR=$(printf '%s' "$DAYS" | tr -cd '0-9')
          OYNA=$(printf '%s' "$END_DATE" | tr -cd '0-9-')
          ISINISH=$(python -c "from core.backtest.warmup import warmup_days; from core.config import load_config; print(warmup_days(load_config()))")
          echo "qiymat=candles-$COINLAR-$((KUNLAR + ISINISH))-${OYNA:-oxirgi}" >> "$GITHUB_OUTPUT"
          echo "asos=candles-$COINLAR-" >> "$GITHUB_OUTPUT"

      # Sham keshi `backtest.yml` bilan BIR XIL kalitda — ikkala ish
      # bir-birining yuklagan shamlarini qayta ishlatadi.
      - name: Sham keshi
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: data/candles
          key: ${{ steps.kalit.outputs.qiymat }}
          restore-keys: ${{ steps.kalit.outputs.asos }}

      - name: Ablation
        if: inputs.tur == 'ikkalasi' || inputs.tur == 'ablation'
        env:
          DAYS: ${{ inputs.days }}
          SYMBOLS: ${{ inputs.symbols }}
          BASE_URL: ${{ inputs.base_url }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          if [ -n "$END_DATE" ]; then OYNA=(--end-date "$END_DATE"); else OYNA=(); fi
          python -m scripts.ablation_test \
            --days "$DAYS" \
            --symbols "$SYMBOLS" \
            --base-url "$BASE_URL" \
            "${OYNA[@]}"

      - name: Walk-forward
        if: inputs.tur == 'ikkalasi' || inputs.tur == 'walk-forward'
        env:
          DAYS: ${{ inputs.days }}
          SYMBOLS: ${{ inputs.symbols }}
          BASE_URL: ${{ inputs.base_url }}
          END_DATE: ${{ inputs.end_date }}
          BOLAKLAR: ${{ inputs.bolaklar }}
          GRID: ${{ inputs.grid }}
        run: |
          if [ -n "$END_DATE" ]; then OYNA=(--end-date "$END_DATE"); else OYNA=(); fi
          python -m scripts.walk_forward \
            --days "$DAYS" \
            --symbols "$SYMBOLS" \
            --base-url "$BASE_URL" \
            --bolaklar "$BOLAKLAR" \
            --grid "$GRID" \
            "${OYNA[@]}"

      - name: Natijani saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tekshiruv-natija
          path: reports/
          if-no-files-found: warn
