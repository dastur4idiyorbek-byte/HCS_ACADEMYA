name: Zanjir o'lchovi

# Yangi tahlil modulining uchta o'lchovi (2-prompt, 8-qism):
#   alternativ    — JONLI TIZIM yuritadigan zanjir (4 blok + alternativ
#                   yo'llar). Jonli sikl aynan shuni chaqiradi, ya'ni
#                   "bizning tizim qanday ishlaydi" degan savolga
#                   javob beradigan O'LCHOV shu.
#   backtest      — bosqichma-bosqich (1-2 blok, +3, to'liq)
#   ablatsiya     — 16 ta ichki tekshiruv birma-bir
#   walk-forward  — kesishmaydigan oynalarda takrorlanish
#   sigim         — portfel chegarasi nechtasini kesadi
#   blok          — blok qoidasi 1/4 mi, 2/4 mi
#   zaiflik       — qaysi ichki tekshiruv doim YO'Q chiqadi
#   hisob         — 1000$ bilan nima bo'lardi (pozitsiya hajmi bilan)
#
# Nima uchun Actions'da: bu muhitdan Binance'ga chiqish yopiq, va
# 730 kunlik yuklash mahalliy mashinada ham uzoq davom etadi.

on:
  workflow_dispatch:
    inputs:
      olchov:
        description: "alternativ | backtest | ablatsiya | walk-forward | chegara | sigim | blok | zaiflik | hisob | hammasi"
        default: "hammasi"
      days:
        description: "Necha kun tahlil qilinsin"
        default: "730"
      symbols:
        description: "Coinlar, vergul bilan (halol skriningdan o'tganlar)"
        default: "BTC,ETH,SOL,ADA,AVAX,LINK,DOT,ATOM,LTC,NEAR,ETC,FIL"
      end_date:
        description: "Sinov oynasining oxiri (YYYY-MM-DD), bo'sh — eng so'nggi"
        default: ""
      base_url:
        description: "Binance REST manzili"
        default: "https://data-api.binance.vision"
      stop_eng_kam:
        description: "Nomzod stop chegarasi (bo'sh — config qiymati)"
        default: ""
      tp1_nisbat:
        description: "Nomzod TP1/Stop nisbati (bo'sh — config qiymati)"
        default: ""

jobs:
  olchov:
    runs-on: ubuntu-latest
    # `| tee` quvuri Python xatosini YASHIRADI: quvurning chiqish
    # kodi `tee` niki bo'ladi, ya'ni 0. 2026-09-04 da aynan shu
    # sodir bo'ldi — skript traceback bilan yiqildi, Actions esa
    # ✅ ko'rsatdi. `pipefail` ansiz o'lchov "bajarildi" deb
    # ko'rinardi-yu, natija bo'lmasdi.
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      - name: Kesh kaliti
        id: kesh
        env:
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          # Actions kesh kaliti VERGULNI qabul qilmaydi — chiziqchaga
          # almashtiriladi. Ansiz butun ish oqimi 6-qadamda yiqilardi.
          toza="${SYMBOLS//,/-}"
          asos="zanjir-${toza}-${{ inputs.days }}-${{ inputs.end_date }}"
          echo "asos=${asos}" >> "$GITHUB_OUTPUT"
          # Kalitga yugurish raqami QO'SHILADI. Ansiz: qisqa yugurish
          # yarim keshni saqlab qo'ysa, keyingi yugurish "cache hit"
          # olardi va yetishmagan coin HECH QACHON yuklanmasdi —
          # 2026-09-04 da `kesh yo'q: ADA 15m` aynan shundan chiqdi.
          echo "kalit=${asos}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      # `cache/restore` + `cache/save` ATAYLAB ajratilgan: oddiy
      # `cache` faqat MUVAFFAQIYATLI yugurishda saqlaydi. Yuklash esa
      # eng uzun qadam (15 daqiqalik qatorda 730 kun = coin boshiga
      # ~90 sahifa) va uni har safar qaytadan qilish — bekorga.
      - name: Sham keshini tiklash
        uses: actions/cache/restore@v4
        id: tiklash
        with:
          path: data/candles
          key: ${{ steps.kesh.outputs.kalit }}
          restore-keys: ${{ steps.kesh.outputs.asos }}-

      - name: Shamlarni yuklash
        run: |
          python -m scripts.zanjir_yuklash \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            --base-url "${{ inputs.base_url }}" \
            ${{ inputs.end_date != '' && format('--end-date {0}', inputs.end_date) || '' }}

      # JONLI TIZIMNING O'LCHOVI. `zanjir_sikl.py` aynan shu zanjirni
      # (`zanjir_yur_alternativ`) yuritadi — boshqa qadam o'lchansa,
      # natija jonli tizimga tegishli bo'lmasdi.
      - name: Alternativ zanjir (jonli tizim)
        if: inputs.olchov == 'alternativ' || inputs.olchov == 'hammasi'
        run: |
          python -m scripts.zanjir_alternativ \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            ${{ inputs.end_date != '' && format('--end-date {0}', inputs.end_date) || '' }} \
            --offline \
            | tee natija_alternativ.txt

      - name: Backtest
        if: inputs.olchov == 'backtest' || inputs.olchov == 'hammasi'
        run: |
          python -m scripts.zanjir_backtest \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            ${{ inputs.end_date != '' && format('--end-date {0}', inputs.end_date) || '' }} \
            --offline \
            | tee natija_backtest.txt

      - name: Ablatsiya
        if: inputs.olchov == 'ablatsiya' || inputs.olchov == 'hammasi'
        run: |
          python -m scripts.zanjir_ablatsiya \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            --offline \
            | tee natija_ablatsiya.txt

      - name: Chegara o'lchovi
        if: inputs.olchov == 'chegara' || inputs.olchov == 'hammasi'
        run: |
          python -m scripts.zanjir_chegara \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            --offline \
            | tee natija_chegara.txt

      - name: Walk-forward
        if: inputs.olchov == 'walk-forward' || inputs.olchov == 'hammasi'
        run: |
          python -m scripts.zanjir_walk_forward \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            ${{ inputs.stop_eng_kam != '' && format('--stop-eng-kam {0}', inputs.stop_eng_kam) || '' }} \
            ${{ inputs.tp1_nisbat != '' && format('--tp1-nisbat {0}', inputs.tp1_nisbat) || '' }} \
            --offline \
            | tee natija_walk_forward.txt

      - name: Sig'im o'lchovi
        if: inputs.olchov == 'sigim' || inputs.olchov == 'hammasi'
        run: |
          python -m scripts.zanjir_sigim \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            --offline \
            | tee natija_sigim.txt

      # Kalit unikal (run_id) — shuning uchun HAR SAFAR saqlanadi.
      # Ilgari `cache-hit != 'true'` sharti bor edi va u yarim
      # keshni abadiy muzlatib qo'yardi.
      - name: Blok qoidasi
        if: inputs.olchov == 'blok' || inputs.olchov == 'hammasi'
        run: |
          python -m scripts.zanjir_blok_qoidasi \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            --offline \
            | tee natija_blok.txt

      - name: Zaiflik hisoboti
        if: inputs.olchov == 'zaiflik' || inputs.olchov == 'hammasi'
        run: |
          python -m scripts.zanjir_zaiflik \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            --offline \
            | tee natija_zaiflik.txt

      - name: Hisob simulyatsiyasi
        if: inputs.olchov == 'hisob' || inputs.olchov == 'hammasi'
        run: |
          python -m scripts.zanjir_hisob \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            --offline \
            | tee natija_hisob.txt

      - name: Sham keshini saqlash
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/candles
          key: ${{ steps.kesh.outputs.kalit }}

      - name: Natijalarni saqlash
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zanjir-natija
          path: |
            natija_*.txt
            reports/
          if-no-files-found: warn
