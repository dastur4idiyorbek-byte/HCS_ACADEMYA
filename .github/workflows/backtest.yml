# Backtestni BRAUZERDA ishga tushirish — kompyuterga hech narsa
# o'rnatmasdan.
#
# GitHub sahifasida: Actions -> "Backtest" -> "Run workflow".
# Tugagach o'sha yerdan `natija` faylini yuklab olasiz.
#
# ESLATMA: GitHub serverlari AQShda joylashgan va `api.binance.com`
# AQSh IP manzillariga 451 qaytaradi. Shuning uchun standart manba —
# `data-api.binance.vision` (Binance'ning ochiq ma'lumot xizmati).
# Agar u ham ishlamasa, `base_url` maydonini o'zgartirib ko'ring.

name: Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Necha kunlik tarix"
        required: true
        default: "730"
      symbols:
        description: "Coinlar (vergul bilan)"
        required: true
        default: "BTC,ETH,SOL,BNB,XRP"
      base_url:
        description: "Binance manbai"
        required: true
        default: "https://data-api.binance.vision"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      # Yuklangan shamlar saqlanadi — keyingi ishga tushirishda
      # Binance'dan qayta so'ralmaydi.
      - name: Sham keshi
        uses: actions/cache@v4
        with:
          path: data/candles
          key: candles-${{ inputs.symbols }}-${{ inputs.days }}
          restore-keys: candles-${{ inputs.symbols }}-

      - name: Backtest
        run: |
          python -m scripts.backtest \
            --compare \
            --days "${{ inputs.days }}" \
            --symbols "${{ inputs.symbols }}" \
            --base-url "${{ inputs.base_url }}" \
            --output natija.txt

      - name: Natijani saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-natija
          path: natija.txt
          if-no-files-found: warn
