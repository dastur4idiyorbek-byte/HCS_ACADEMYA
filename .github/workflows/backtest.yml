# Backtestni BRAUZERDA ishga tushirish — kompyuterga hech narsa
# o'rnatmasdan.
#
# GitHub sahifasida: Actions -> "Backtest" -> "Run workflow".
# Tugagach o'sha yerdan `natija` faylini yuklab olasiz.
#
# ESLATMA: GitHub serverlari AQShda joylashgan va `api.binance.com`
# AQSh IP manzillariga 451 qaytaradi. Shuning uchun standart manba —
# `data-api.binance.vision` (Binance'ning ochiq ma'lumot xizmati).
# Agar u ham ishlamasa, `base_url` maydonini o'zgartirib ko'ring.

name: Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Necha kun TAHLIL qilinsin (isinish tarixi ustiga qo'shiladi)"
        required: true
        default: "730"
      symbols:
        description: "Coinlar (vergul bilan)"
        required: true
        default: "BTC,ETH,SOL,BNB,XRP"
      base_url:
        description: "Binance manbai"
        required: true
        default: "https://data-api.binance.vision"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      # Kesh kaliti VERGUL saqlamaydi — GitHub uni rad etadi va butun
      # ish shu yerda to'xtaydi. Shuning uchun "BTC,ETH" -> "BTC-ETH".
      #
      # Qiymat `env` orqali beriladi, `run` matniga to'g'ridan-to'g'ri
      # qo'yilmaydi: aks holda kiritilgan matn buyruqning bir qismiga
      # aylanib qolishi mumkin.
      #
      # Kalitda TAHLIL + ISINISH kunlari turadi. Faqat tahlil kunlari
      # bo'lganda isinish talabi o'zgargach eski, KALTA kesh qayta
      # ishlatilardi — skript uni sezib qayta yuklaydi, lekin kesh
      # kaliti allaqachon band bo'lgani uchun yangisi saqlanmasdi va
      # har ishga tushirish Binance'dan boshdan yuklardi.
      - name: Kesh kaliti
        id: kalit
        env:
          SYMBOLS: ${{ inputs.symbols }}
          DAYS: ${{ inputs.days }}
        run: |
          COINLAR=$(printf '%s' "$SYMBOLS" | tr ',' '-' | tr -cd 'A-Za-z0-9-')
          KUNLAR=$(printf '%s' "$DAYS" | tr -cd '0-9')
          ISINISH=$(python -c "from core.backtest.warmup import warmup_days; from core.config import load_config; print(warmup_days(load_config()))")
          echo "qiymat=candles-$COINLAR-$((KUNLAR + ISINISH))" >> "$GITHUB_OUTPUT"
          echo "asos=candles-$COINLAR-" >> "$GITHUB_OUTPUT"

      # Yuklangan shamlar saqlanadi — keyingi ishga tushirishda
      # Binance'dan qayta so'ralmaydi. Kesh nosozligi backtestni
      # to'xtatmasligi kerak: u tezlik uchun, natija uchun emas.
      - name: Sham keshi
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: data/candles
          key: ${{ steps.kalit.outputs.qiymat }}
          restore-keys: ${{ steps.kalit.outputs.asos }}

      - name: Backtest
        env:
          DAYS: ${{ inputs.days }}
          SYMBOLS: ${{ inputs.symbols }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          python -m scripts.backtest \
            --compare \
            --days "$DAYS" \
            --symbols "$SYMBOLS" \
            --base-url "$BASE_URL" \
            --output natija.txt

      - name: Natijani saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-natija
          path: natija.txt
          if-no-files-found: warn
